<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markham FireBirds Wiki</title>
  <script>
    // Single Page Apps for GitHub Pages - sessionStorage redirect
    // Stores the requested path and redirects to index.html
    (function () {
      var path = window.location.pathname;
      if (path === '/404.html' || path === '/') return;
      sessionStorage.redirect = path;
      window.location.replace('/');
    })();
  </script>
</head>
<body>
  <noscript>
    <p>The Markham FireBirds Wiki requires JavaScript to run.</p>
    <p>Please enable JavaScript and <a href="/">go to the homepage</a>.</p>
  </noscript>
</body>
</html>
