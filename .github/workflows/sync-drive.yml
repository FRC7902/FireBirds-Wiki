name: Sync Google Drive & Deploy

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"

  workflow_dispatch: # Allows manual sync from GitHub Actions tab

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Sync Google Drive
        run: |
          python -m backend.services.sync.drive_sync
        env:
          GOOGLE_DRIVE_FOLDER_URL: ${{ secrets.GOOGLE_DRIVE_FOLDER_URL }}
          WIKI_CONTENT_DIR: ./website/docs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add website/docs/ website/static/assets/ website/static/docs/ metadata.json

          git diff --cached --quiet || git commit -m "Auto-sync: Update documentation from Google Drive

          Synced: $(date +%Y-%m-%d\ %H:%M:%S\ UTC)"

          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install website dependencies
        run: |
          cd website
          npm ci

      - name: Build Docusaurus site
        run: |
          cd website
          npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          force_orphan: true
